<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App: Weather on your fingertips!</title>
    <link rel="stylesheet" href="weather_new.css">
</head>
<body>
    <div class="parallax">
        <div class="background-image"></div>
        <div class="card-container">
            <div class="card">
                <div class="search">
                    <input type="text" placeholder="Enter City name" spellcheck="false">
                    <button>
                        <img src="search.png">
                    </button>
                </div>
                <div class="error"> 
                    <p>Enter a valid city name</p>
                </div>
                <div class="weather">
                    <img src="drizzle.png" class="weather-icon">
                    <h1 class="temperature">22 °C</h1>
                    <h2 class="city">India</h2>
                    <div class="details">
                        <div class="col">
                            <img src="weather.png">    
                        </div>
                        <div>
                            <p><span class="humidity">50%</span></p>
                            <p>Humidity</p>
                        </div>
                        <div class="col">
                            <img src="windy.png">    
                        </div>
                        <div>
                            <p><span class="wind">15km/h</span></p>
                            <p>Wind Speed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const apiKey = "4b5551810f2ea5f637ccad3e73a8cf97";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";

        const searchBox = document.querySelector(".search input");
        const searchButton = document.querySelector(".search button");
        const weatherIcon = document.querySelector(".weather-icon");
        const backgroundImage = document.querySelector(".background-image");

        async function checkWeather(city) {
            if (city.trim() === "") {
                // If the city name is empty, hide weather details and background
                document.querySelector(".weather").style.display = "none";
                document.querySelector(".error").style.display = "none";
                backgroundImage.style.display = "block";
                return;
            }

            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

            if (response.status == 404) {
                document.querySelector(".error").style.display = "block";
                document.querySelector(".weather").style.display = "none";
                backgroundImage.style.display = "block";
            } else {
                var data = await response.json();

                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temperature").innerHTML = Math.round(data.main.temp) + "°C";
                document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
                document.querySelector(".wind").innerHTML = data.wind.speed + "km/hr";

                if (data.weather && data.weather[0]) {
                    const weatherMain = data.weather[0].main;

                    switch (weatherMain) {
                        case "Clouds":
                            weatherIcon.src = "cloud.png";
                            setBackground("5726957.jpg"); // Change the background for cloudy weather
                            break;
                        case "Rain":
                            weatherIcon.src = "kid.png";
                            setBackground("10087.jpg"); // Change the background for rainy weather
                            break;
                        case "Snow":
                            weatherIcon.src = "snow.png";
                            setBackground("6162750.jpg"); // Change the background for snowy weather
                            break;
                        case "Clear":
                            weatherIcon.src = "sun.png";
                            setBackground("2310-w062-n005-285A-p30-285.jpg"); // Change the background for clear weather
                            break;
                        case "Drizzle":
                            weatherIcon.src = "drizzle.png";
                            setBackground("drizzle-background.jpg"); // Change the background for drizzle weather
                            break;
                        case "Thunderstorm":
                            weatherIcon.src = "windy.png";
                            setBackground("5255894.jpg"); // Change the background for thunderstorm weather
                            break;
                        case "Fog":
                            weatherIcon.src = "fog.png";
                            setBackground("axcn_lm3k_211202.jpg"); // Change the background for foggy weather
                            break;
                        default:
                            weatherIcon.src = "default.png"; // You can set a default image for unknown conditions
                            setBackground("sunset-silhouettes-trees-mountains-generative-ai.jpg"); // Change the background for unknown conditions
                    }

                    document.querySelector(".weather").style.display = "block";
                    document.querySelector(".error").style.display = "none";
                    backgroundImage.style.display = "block";
                }
            }
        }

        function setBackground(imageUrl) {
            backgroundImage.style.backgroundImage = `url('${imageUrl}')`;
        }

        searchButton.addEventListener("click", () => {
            checkWeather(searchBox.value);
        });

        // Listen for changes in the input field
        searchBox.addEventListener("input", () => {
            checkWeather(searchBox.value);
        });

        // Initial check when the page loads
        checkWeather("");
    </script>
</body>
</html>
