
<!DOCTYPE html>
<html lang="en" lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App : Weather on your fingertips!</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City name" spellcheck="false">
            <button>
                <img src="search.png">
            </button>
        </div>
        <div class="error"> 
            <p>Enter a valid city name</p>
        </div>
        <div class="weather">
            <img src="drizzle.png" class="weather-icon">
            <h1 class="temperature">22 ��C</h1>
            <h2 class="city">India</h2>
            <div class="details">
                <div class="col">
                    <img src="weather.png">    
            </div>
            <div>
                <p><span class="humidity">50%</span>
                </p>
                <p>Humidity</p>
            </div>
            <div class="col">
                <img src="windy.png">    
            </div>
            <div>
                <p><span class="wind">15km/h</span></p>
                <p>Wind Speed</p>
            </div>
        </div>
    </div>
    </div>
    <script>
        const apiKey = "4b5551810f2ea5f637ccad3e73a8cf97";
        const apiUrl="https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";

        const searchBox=document.querySelector(".search input");
        const searchButton=document.querySelector(".search button");
        const weatherIcon=document.querySelector(".weather-icon");
        
        async function checkWeather(city){
            const response = await fetch(apiUrl+ city+`&appid=${apiKey}`);

            if(response.status==404) { /** error returns 400 code*/
                document.querySelector(".error").style.display="block";
                document.querySelector(".weather").style.display="none";
            }
            else {var data=await response.json();

            document.querySelector(".city").innerHTML=data.name;
            document.querySelector(".temperature").innerHTML=Math.round(data.main.temp)+"°C";
            document.querySelector(".humidity").innerHTML=data.main.humidity+"%";
            document.querySelector(".wind").innerHTML=data.wind.speed+"km/hr";

            if(data.weather[0].main=="Clouds"){
                weatherIcon.src="cloud.png";
            }
            else if(data.weather[0].main=="Rain"){
                weatherIcon.src="kid.png";
            }
            else if(data.weather[0].main=="Snow"){
                weatherIcon.src="snow.png";
            }       
            else if(data.weather[0].main=="Clear"){
                weatherIcon.src="sun.png";
            }
            else if(data.weather[0].main=="Drizzle"){
                weatherIcon.src="drizzle.png";
            }
            else if(data.weather[0].main=="Thunderstorm"){
                weatherIcon.src="storm.png";
            }
            
            else if(data.weather[0].main=="Fog"){
                weatherIcon.src="fog.png";
            }
            document.querySelector(".weather").style.display="block";
            document.querySelector(".error").style.display="none";
        
}
        }
            
        
        

        searchButton.addEventListener("click",()=>{
            checkWeather(searchBox.value);            
        });
            checkWeather();
           </script>
</body>
</html>
